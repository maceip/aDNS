# Rustfmt config, modeled on tlsnotary/tlsn with stable-safe defaults.
# `imports_granularity` needs nightly rustfmt; stable `cargo fmt` warns and
# keeps going, so CI on stable still passes while nightly gets merged imports.
edition = "2024"
max_width = 100
wrap_comments = true
comment_width = 100
format_code_in_doc_comments = true
normalize_doc_attributes = true
reorder_imports = true
reorder_modules = true
imports_granularity = "Crate"
