apiVersion: 1
datasources:
  - name: AgentDNS Tempo
    type: tempo
    uid: agentdns-tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: agentdns-loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
      lokiSearch:
        datasourceUid: agentdns-loki
  - name: AgentDNS Loki
    type: loki
    uid: agentdns-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: agentdns-tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace
