[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
